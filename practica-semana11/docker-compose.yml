services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biblioteca
    ports:
      - '5432:5432'
    volumes:
      - biblioteca_pgdata:/var/lib/postgresql/data
    # ── TODO 5: healthcheck: test: ['CMD-SHELL', 'pg_isready -U postgres'] (+ interval/timeout/retries) ──

  app:
    build: .
    restart: unless-stopped
    # ── TODO 6: depends_on: postgres: condition: service_healthy ──
    #   (sin esto, "app" puede arrancar antes de que Postgres acepte conexiones)
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/biblioteca
    ports:
      - '3000:3000'
    volumes:
      - biblioteca_uploads:/app/uploads/portadas

volumes:
  biblioteca_pgdata:
  biblioteca_uploads:
